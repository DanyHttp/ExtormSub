name: Release

# Push a tag like v0.2.0 to build the installer and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }

      - name: Build installer (runs tests)
        shell: pwsh
        run: ./build/build-installer.ps1 -Version ("${{ github.ref_name }}".TrimStart('v'))

      # The update manifest holds the installer's SHA-256.
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem artifacts/ExtormSub-Setup-*.exe | Select-Object -First 1
          $manifest = [ordered]@{
              version = "${{ github.ref_name }}".TrimStart('v')
              url     = $setup.Name
              sha256  = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
              size    = $setup.Length
          } | ConvertTo-Json
          [IO.File]::WriteAllText("$PWD/latest.json", $manifest)
          gh release create "${{ github.ref_name }}" $setup.FullName latest.json --title "ExtormSub ${{ github.ref_name }}" --generate-notes
